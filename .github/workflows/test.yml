name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04   # ubuntu-latest is now 26.04, whose package names Playwright 1.48 doesn't know
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:unit
      - run: npm run test:e2e:all
      - uses: actions/upload-artifact@v4
        if: always()   # videos exist whether the suite passed or failed
        with:
          name: playwright-videos
          path: test-results/**/*.webm
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report }

  # Serves the app at https://<user>.github.io/staples/ — only after tests pass,
  # only from main. Needs a one-time repo setting: Settings → Pages → Source: GitHub Actions.
  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - run: mkdir _site && cp staple.html _site/index.html && cp staple.html _site/staple.html && cp privacy.html _site/privacy.html && cp links.html _site/links.html && cp sw.js manifest.webmanifest icon.svg icon-512.png _site/
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
